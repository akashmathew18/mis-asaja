<div class="container mt-3">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h4>Team Ledger</h4>

        <button class="btn btn-primary" routerLink="../teams">

            Manage Teams

        </button>

    </div>

    <!-- FILTERS -->
    <div class="card p-3 mb-4">

        <div class="row g-3">

            <div class="col-md-3">

                <label>Team</label>

                <input type="text" class="form-control" list="teamFilterList" placeholder="Type & search team"
                    [(ngModel)]="teamSearchText" (ngModelChange)="onTeamFilterChange($event)" name="teamSearchText">

                <datalist id="teamFilterList">

                    <option value="">
                        All Teams
                    </option>

                    <option *ngFor="let t of teams" [value]="t.team_name">
                    </option>

                </datalist>

            </div>

            <div class="col-md-3">

                <label>Search</label>

                <input class="form-control" placeholder="Search anything..." [(ngModel)]="search"
                    (keyup)="loadLedger()">

            </div>

            <div class="col-md-2">

                <label>From</label>

                <input type="date" class="form-control" [(ngModel)]="fromDate">

            </div>

            <div class="col-md-2">

                <label>To</label>

                <input type="date" class="form-control" [(ngModel)]="toDate">

            </div>

            <div class="col-md-2 d-flex align-items-end">

                <button class="btn btn-primary w-100" (click)="loadLedger()">

                    Apply

                </button>

            </div>

        </div>

        <div class="mt-3 d-flex gap-2 flex-wrap">

            <button class="btn btn-secondary" (click)="clearFilters()" [disabled]="!hasFilters()">

                Clear

            </button>



        </div>

    </div>


    <div class="export-buttons">

        <button class="btn btn-success" (click)="exportExcel()">

            Export Excel

        </button>

        <button class="btn btn-danger" (click)="exportPDF()">

            Export PDF

        </button>

    </div>

    <hr>



    <!-- LEDGER -->
    <div class="table-responsive">
        <table class="table table-bordered table-sm" *ngIf="ledger.length">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Txn ID</th>
                    <th>Team</th>
                    <th>Particulars</th>
                    <th>Remarks</th>
                    <th>Credit</th>
                    <th>Debit</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody>

                <tr *ngFor="let r of filteredLedger">
                    <td>{{ r.entry_date }}</td>
                    <td>{{ r.transaction_id }}</td>
                    <td>{{ r.team_name }}</td>
                    <td>{{ r.particulars }}</td>
                    <td>{{ r.remarks }}</td>
                    <td class="text-success">{{ r.credit }}</td>
                    <td class="text-danger">{{ r.debit }}</td>
                    <td class="fw-bold">{{ r.balance }}</td>
                </tr>

                <tr class="fw-bold table-secondary">
                    <td colspan="7">Final Balance (Credit − Debit)</td>
                    <td>{{ finalBalance() }}</td>
                </tr>

            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3">

            <div>

                Total Records:
                {{ totalRecords }}

            </div>

            <div class="btn-group">

                <button class="btn btn-sm btn-outline-primary" (click)="changePage(currentPage - 1)"
                    [disabled]="currentPage === 1">

                    Prev

                </button>

                <button class="btn btn-sm btn-primary">

                    {{ currentPage }}

                </button>

                <button class="btn btn-sm btn-outline-primary" (click)="changePage(currentPage + 1)"
                    [disabled]="currentPage === totalPages">

                    Next

                </button>

            </div>

        </div>
    </div>

</div>
