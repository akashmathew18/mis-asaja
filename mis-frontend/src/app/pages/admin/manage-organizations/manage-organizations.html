<div class="container mt-4">

    <h3 class="text-center mb-4">
        Manage Organizations
    </h3>

    <!-- ================= HEADER ACTIONS ================= -->

    <div class="d-flex justify-content-end mb-4">

        <button class="btn btn-dashboard" (click)="backToDashboard()">

            Back to Dashboard

        </button>

    </div>


    <!-- FORM -->

    <div class="card p-4 mb-4">

        <div class="row g-3 align-items-end">

            <div class="col-md-8">

                <label>
                    <strong>Organization Name</strong>
                </label>

                <input class="form-control" placeholder="Enter organization name" [(ngModel)]="form.org_name" />

            </div>

            <div class="col-md-4">

                <div class="action-row">

                    <button class="btn btn-save" (click)="save()">
                        {{ editing ? 'Update Organization' : 'Create Organization' }}
                    </button>

                    <button *ngIf="editing" class="btn btn-cancel" (click)="reset()">
                        Cancel
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLE -->

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-bordered text-center">

                <thead>

                    <tr>
                        <th>Organization ID</th>
                        <th>Organization Name</th>
                        <th>Status</th>
                        <th class="action-column">Actions</th>
                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let o of organizations">

                        <td>
                            {{ o.org_id }}
                        </td>

                        <td>
                            {{ o.org_name }}
                        </td>

                        <td>

                            <span class="status-badge" [ngClass]="
            o.data_status === 'Active'
                ? 'status-active'
                : 'status-inactive'
        ">
                                {{ o.data_status }}
                            </span>

                        </td>

                        <td>

                            <div class="d-flex gap-2 justify-content-center">

                                <button class="btn btn-sm btn-primary" (click)="edit(o)">
                                    Edit
                                </button>

                                <button class="btn btn-sm" [ngClass]="
                                        o.data_status === 'Active'
                                            ? 'btn-danger'
                                            : 'btn-success'
                                    " (click)="toggleStatus(o)">
                                    {{
                                    o.data_status === 'Active'
                                    ? 'Deactivate'
                                    : 'Activate'
                                    }}
                                </button>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<app-dialog></app-dialog>
