<div class="container mt-4">

    <h3 class="text-center mb-4">
        Manage Divisions
    </h3>

    <!-- HEADER ACTIONS -->

    <div class="d-flex justify-content-end mb-4">

        <button class="btn btn-dashboard" (click)="backToDashboard()">
            Back to Dashboard
        </button>

    </div>

    <!-- FORM -->

    <div class="card p-4 mb-4">

        <div class="row g-3 align-items-end">

            <!-- DIVISION NAME -->

            <div class="col-md-4">

                <label>
                    <strong>Division Name</strong>
                </label>

                <input class="form-control" placeholder="Enter division name" [(ngModel)]="form.div_name" />

            </div>

            <!-- ORGANIZATION -->

            <div class="col-md-4">

                <label>
                    <strong>Organization</strong>
                </label>

                <select class="form-control" [(ngModel)]="form.org_id">

                    <option value="">
                        Select Organization
                    </option>

                    <option *ngFor="let o of organizations" [value]="o.org_id">
                        {{ o.org_name }}
                    </option>

                </select>

            </div>

            <!-- DISTRICT -->

            <!-- DISTRICT -->

            <div class="col-md-2">

                <label>
                    <strong>District Name</strong>
                </label>

                <select class="form-control" [(ngModel)]="form.dist_id">

                    <option value="">
                        Select District
                    </option>

                    <option *ngFor="let d of districts" [value]="d.dist_id">
                        {{ d.dist_name }}
                    </option>

                </select>

            </div>

            <!-- ACTIONS -->

            <div class="col-md-2">

                <div class="action-row">

                    <button class="btn btn-save" (click)="save()">
                        {{ editing ? 'Update' : 'Create' }}
                    </button>

                    <button *ngIf="editing" class="btn btn-cancel" (click)="reset()">
                        Cancel
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLE -->

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead>
                    <tr>
                        <th>DIV ID</th>
                        <th>Division</th>
                        <th>Organization</th>
                        <th>District</th>
                        <th>Status</th>
                        <th class="action-column">
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let d of divisions">
                        <td> {{ d.div_id }}</td>
                        <td> {{ d.div_name }}</td>
                        <td>{{ d.org_name }}</td>

                        <!-- DISTRICT NAME -->
                        <td> {{ d.dist_name }} </td>

                        <td> <span class="status-badge" [ngClass]="
                    d.data_status === 'Active'
                        ? 'status-active'
                        : 'status-inactive'
                ">
                                {{ d.data_status }}
                            </span> </td>

                        <td>

                            <div class="d-flex gap-2 justify-content-center">

                                <button class="btn btn-sm btn-primary" (click)="edit(d)">
                                    Edit
                                </button>

                                <button class="btn btn-sm" [ngClass]="
                        d.data_status === 'Active'
                            ? 'btn-danger'
                            : 'btn-success'
                    " (click)="toggleStatus(d)">
                                    {{
                                    d.data_status === 'Active'
                                    ? 'Deactivate'
                                    : 'Activate'
                                    }}
                                </button>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<app-dialog></app-dialog>
