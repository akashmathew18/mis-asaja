<div class="container mt-4">
    <h3 class="text-center mb-4">Manage Users</h3>

    <!-- ================= HEADER ACTIONS ================= -->

    <div class="d-flex justify-content-end mb-4">

        <button class="btn btn-dashboard" (click)="backToDashboard()">

            Back to Dashboard

        </button>

    </div>

    <!-- User Form Card -->
    <div class="card p-4 mb-4">
        <div class="row">
            <div class="col-md-3">
                <input class="form-control" placeholder="Full Name" [(ngModel)]="form.full_name" />
            </div>
            <div class="col-md-3">
                <input class="form-control" placeholder="Username" [(ngModel)]="form.username" />
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" placeholder="Password" [(ngModel)]="form.password" />
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" placeholder="Confirm Password"
                    [(ngModel)]="form.confirmPassword" />
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-3">
                <select class="form-control" [(ngModel)]="form.role">
                    <option value="user">User</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>
            <div class="col-md-9">
                <label><strong>Assign Firms:</strong></label>
                <div class="firm-grid">
                    <div *ngFor="let f of firms">
                        <input type="checkbox" [checked]="form.firms.includes(f.firm_code)"
                            (change)="toggleFirm(f.firm_code)" />
                        {{ f.firm_name }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons: Save (Create/Update) + Cancel Edit (visible only when editing) -->
        <div class="mt-3">
            <button class="btn btn-success" (click)="save()">
                {{ editing ? 'Update User' : 'Create User' }}
            </button>
            <button *ngIf="editing" class="btn btn-cancel" (click)="cancelEdit()">
                Cancel Edit
            </button>
        </div>
    </div>

    <!-- Users Table Card -->
    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead>
                    <tr>
                        <th>UserID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let u of users">
                        <td>{{ u.userid }}</td>
                        <td>{{ u.full_name }}</td>
                        <td>

                            <span class="role-badge" [ngClass]="u.role === 'Admin' ? 'role-admin' : 'role-user'">

                                {{ u.role }}

                            </span>

                        </td>

                        <td>

                            <span class="status-badge"
                                [ngClass]="u.status === 'Active' ? 'status-active' : 'status-inactive'">

                                {{ u.status }}

                            </span>

                        </td>
                        <td class="d-flex gap-2">
                            <!-- EDIT Button -->
                            <button class="btn btn-sm btn-primary" (click)="edit(u)">
                                Edit
                            </button>
                            <!-- TOGGLE STATUS (Activate/Deactivate) -->
                            <button class="btn btn-sm" [ngClass]="u.status === 'Active' ? 'btn-danger' : 'btn-success'"
                                (click)="toggleStatus(u)">
                                {{ u.status === 'Active' ? 'Deactivate' : 'Activate' }}
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<app-dialog></app-dialog>
